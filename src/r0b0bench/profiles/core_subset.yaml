# Profile: core-subset — powered quality subsets + mandatory systems block
profile: core-subset
description: Powered quality subsets plus full systems package (default RC qualification path)
includes_systems: true
quality:
  qa:
    mode: subset
    n: 400
    population_n: 2376
    dataset: allenai/ai2_arc ARC-Easy test
    concurrency: 2
    max_tokens: 1024
  ifeval:
    mode: subset
    n: 200
    population_n: 541
    concurrency: 2
    max_tokens: 4096
    note: lightweight constraint scorer (not full official IFEval package)
  humaneval:
    mode: full
    n: 164
    concurrency: 2
    max_tokens: 4096
  gsm8k:
    mode: subset
    n: 200
    population_n: 1319
    concurrency: 2
    max_tokens: 4096
    note: 0-shot flexible-extract
lane_order:
  - systems  # canary, bfcl_mt, bfcl_ast, latency, concurrency, throughput, niah
  - qa
  - ifeval
  - humaneval
  - gsm8k
